grumphp:
  ascii:
    failed: ~
    succeeded: ~
  tasks:
    phpinsights: ~
    tests: ~
    phpcsfixer:
      verbose: true
      config: .php-cs-fixer.php
      using_cache: false
    git_blacklist:
      keywords:
        - "var_export\\("
        - "die\\("
        - "var_dump\\("
        - "exit;"
        - "dd\\("
        - "dump\\("
        - "console.log\\("
      match_word: true
      triggered_by: [php, js]
      regexp_type: E
      whitelist_patterns:
        - /^(?!public).*/

services:
  Tests\GrumPHP\PhpInsightsTask:
    arguments:
      - '@process_builder'
      - '@formatter.raw_process'
    tags:
      - {name: grumphp.task, task: phpinsights}
  Tests\GrumPHP\TestsTask:
    arguments:
      - '@process_builder'
      - '@formatter.raw_process'
    tags:
      - { name: grumphp.task, task: tests }
