grumphp:
  ascii:
    failed: ~
    succeeded: ~
  tasks:
    phpinsights: ~
    git_blacklist:
      keywords:
        - "die("
        - "var_dump("
        - "exit;"
        - "dd("
        - "dump("
        - "console.log("
      match_word: true
      triggered_by: ['php', 'js']
    shell:
      scripts:
        - ["-c", "php artisan insight"]

services:
  Tests\GrumPHP\PhpInsightsTask:
    arguments:
      - '@process_builder'
      - '@formatter.raw_process'
    tags:
      - {name: grumphp.task, task: phpinsights}
