grumphp:
  ascii:
    failed: ~
    succeeded: ~
  tasks:
    git_blacklist:
      keywords:
        - "die("
        - "var_dump("
        - "exit;"
        - "dd("
        - "dump("
        - "console.log("
      match_word: true
      triggered_by: ['php', 'js']
    shell:
      scripts:
        - ["-c", "php artisan insight"]


