services:

  # ── PHP-FPM application ─────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: gitant_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html:delegated
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      PHP_OPCACHE_ENABLE: 1
    depends_on:
      - postgres
      - redis
    networks:
      - gitant

  # ── Nginx web server ────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: gitant_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - gitant

  # ── PostgreSQL 16 ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gitant_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-gitant}
      POSTGRES_USER: ${DB_USERNAME:-gitant}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - gitant
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-gitant}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 7 ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gitant_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-secret}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - gitant
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Laravel Reverb WebSocket server ─────────────────────────────────────────
  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: gitant_reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080 --env=production
    volumes:
      - .:/var/www/html:delegated
    environment:
      APP_ENV: production
    ports:
      - "${REVERB_PORT:-8080}:8080"
    depends_on:
      - postgres
      - redis
    networks:
      - gitant

  # ── Queue worker ────────────────────────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: gitant_queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www/html:delegated
    depends_on:
      - postgres
      - redis
    networks:
      - gitant

  # ── Vite dev server (dev only, override in compose.override.yml) ────────────
  vite:
    image: node:22-alpine
    container_name: gitant_vite
    working_dir: /var/www/html
    command: npm run dev
    volumes:
      - .:/var/www/html
    ports:
      - "5173:5173"
    networks:
      - gitant
    profiles:
      - dev

volumes:
  postgres_data:
  redis_data:

networks:
  gitant:
    driver: bridge
