services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: gitant_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    networks:
      - gitant
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: gitant_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - gitant
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    container_name: gitant_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-gitant}
      POSTGRES_USER: ${DB_USERNAME:-gitant}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - gitant
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-gitant} -d ${DB_DATABASE:-gitant}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gitant_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-secret}"
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - gitant
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  gitant:
    driver: bridge

volumes:
  db_data:
  redis_data:
